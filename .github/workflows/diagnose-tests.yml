name: Diagnoza testów
on:
  push:
    branches: ["feature/diagnose-flaky-tests"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, stress]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Run the suite repeatedly
        run: |
          report() { grep -n -E "^\s*not ok" "$1" | while read -r line; do echo "::error::$2: $line"; done
            awk '/^\s*not ok/{f=1;c=0} f{print; c++} c>30{f=0}' "$1" | grep -E "error:|expected|actual|message|location|failureType|code:|stack" | head -12 | while read -r line; do echo "::error::$2 detail: $line"; done; }
          for i in $(seq 1 10); do
            if [ "${{ matrix.mode }}" = stress ]; then
              pnpm test -- --test-reporter=tap > "a-$i.tap" 2>&1 & pnpm test -- --test-reporter=tap > "b-$i.tap" 2>&1 & wait
              for f in a b; do grep -E "^# (pass|fail)" "$f-$i.tap" | tr '\n' ' ' | sed "s/^/::notice::stress $i$f: /"; echo; report "$f-$i.tap" "stress $i$f"; done
            else
              pnpm test -- --test-reporter=tap > "run-$i.tap" 2>&1 || true
              grep -E "^# (pass|fail)" "run-$i.tap" | tr '\n' ' ' | sed "s/^/::notice::plain $i: /"; echo; report "run-$i.tap" "plain $i"
            fi
          done
