name: Diagnoza testów
on:
  push:
    branches: ["feature/diagnose-flaky-tests"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Run the suite repeatedly
        run: |
          for i in $(seq 1 8); do
            node --test --test-reporter=tap tests/*.test.mjs > "run-$i.tap" 2>&1 || true
            grep -E "^# (pass|fail)" "run-$i.tap" | tr '\n' ' ' | sed "s/^/::notice::run $i: /"; echo
            grep -n -E "^\s*not ok" "run-$i.tap" | while read -r line; do echo "::error::run $i: $line"; done
            awk '/^\s*not ok/{f=1;c=0} f{print; c++} c>25{f=0}' "run-$i.tap" | grep -E "error:|expected|actual|message|location|failureType|code:" | head -20 | while read -r line; do echo "::error::run $i detail: $line"; done
          done
